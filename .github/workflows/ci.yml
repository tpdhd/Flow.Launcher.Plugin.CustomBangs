name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build and test
        shell: pwsh
        run: ./build.ps1
      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: Flow.Launcher.Plugin.CustomBangs
          path: artifacts/*.zip

